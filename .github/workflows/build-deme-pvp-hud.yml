name: Build Deme PvP HUD

on:
  push:
    branches: [fabric-pvp-hud]
    paths:
      - 'minecraft-client/**'
      - '.github/workflows/build-deme-pvp-hud.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        working-directory: minecraft-client
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: deme-pvp-hud
          path: |
            minecraft-client/build/libs/*.jar
            !minecraft-client/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
