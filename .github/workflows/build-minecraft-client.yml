name: Build Deme FPS + Keys HUD

on:
  push:
    branches:
      - main
      - fabric-pvp-hud
      - fps-keyboard-hud
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        working-directory: minecraft-client
        run: gradle build

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: deme-fps-keys-hud
          path: minecraft-client/build/libs/*.jar
          if-no-files-found: error
