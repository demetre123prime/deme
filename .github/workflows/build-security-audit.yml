name: Build Minecraft Security Audit Mod

on:
  push:
    paths:
      - "security-audit-mod/**"
      - ".github/workflows/build-security-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25 (required by current Fabric Loom)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build safe mod JAR
        working-directory: security-audit-mod
        run: gradle build --no-daemon

      - name: Prepare direct JAR download
        run: mkdir -p release-files && cp security-audit-mod/build/libs/*.jar release-files/security-audit-mod.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-mod
          path: release-files/security-audit-mod.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct JAR download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: security-audit-latest
          name: Security Audit Mod (latest build)
          body: "Harmless Minecraft client mod. This build does not collect personal data."
          files: release-files/security-audit-mod.jar
          overwrite_files: true
          make_latest: true
