name: Build Minecraft Security Audit Mod

on:
  push:
    paths:
      - "security-audit-mod/**"
      - ".github/workflows/build-security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25 (required by current Fabric Loom)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod JAR
        working-directory: security-audit-mod
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-mod
          path: security-audit-mod/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
